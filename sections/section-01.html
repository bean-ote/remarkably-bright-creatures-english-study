<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Remarkably Bright Creatures - Section 1 English Study Sheet</title>
  <style>
    :root { --ink:#202124; --muted:#5f6368; --line:#d7dde5; --soft:#f6f8fa; --accent:#a33a3a; --accent2:#176b87; }
    * { box-sizing:border-box; }
    body { margin:0; background:#e9edf2; color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Arial,sans-serif; line-height:1.42; }
    .page { width:210mm; min-height:297mm; margin:18px auto; padding:13mm 13mm 11mm; background:#fff; box-shadow:0 10px 30px rgba(20,30,50,.16); break-after:page; page-break-after:always; }
    .page:last-child { break-after:auto; page-break-after:auto; }
    header { display:grid; grid-template-columns:1fr auto; gap:14px; align-items:end; padding-bottom:9px; border-bottom:2px solid var(--ink); }
    h1 { margin:0; font-size:19px; letter-spacing:0; }
    .subtitle { margin:4px 0 0; color:var(--muted); font-size:10.5px; }
    .badge { border:1px solid var(--line); border-radius:6px; padding:7px 10px; color:var(--accent); font-size:11px; font-weight:800; white-space:nowrap; }
    .note { margin:10px 0 12px; padding:8px 10px; border-left:4px solid var(--accent2); background:#f3f8fa; color:#263238; font-size:10.5px; }
    .grid { margin-top:10px; border:1px solid var(--line); border-bottom:0; }
    .row { display:grid; grid-template-columns:49% 51%; border-bottom:1px solid var(--line); break-inside:avoid; page-break-inside:avoid; }
    .cell { padding:8px 10px; }
    .english { border-right:1px solid var(--line); }
    .num { display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px; margin-right:6px; border-radius:50%; background:var(--ink); color:#fff; font-size:10px; font-weight:800; vertical-align:top; }
    .sentence { display:inline; white-space:pre-line; font-size:12.2px; font-weight:700; }
    .focus { display:block; margin:0 0 4px; color:var(--accent); font-size:10px; font-weight:850; text-transform:uppercase; }
    ul { margin:0; padding-left:16px; font-size:10.5px; }
    li + li { margin-top:2px; }
    code { padding:1px 4px; border-radius:4px; background:var(--soft); font-family:"SFMono-Regular",Consolas,monospace; font-size:9.7px; }
    .chunks { margin-top:7px; padding:6px 8px; border-left:3px solid #d49a2a; background:#fff9ec; font-size:10.2px; }
    .chunks strong { display:block; margin-bottom:3px; color:#8a5a00; font-size:9.8px; }
    .chunk + .chunk { margin-top:3px; }
    .translation { margin:7px 0 0; padding-top:6px; border-top:1px dashed var(--line); color:var(--muted); font-size:10.4px; }
    .translation::before { content:"해석 "; color:var(--accent2); font-weight:800; }
    footer { margin-top:9px; color:var(--muted); font-size:9.3px; }
    @page { size:A4; margin:0; }
    @media print { body{background:#fff} .page{margin:0;box-shadow:none;width:210mm;min-height:297mm} }
    @media(max-width:800px){ .page{width:100%;min-height:auto;margin:0;padding:18px} .row{grid-template-columns:1fr} .english{border-right:0;border-bottom:1px dashed var(--line)} }
    .site-nav { display:flex; justify-content:space-between; align-items:center; gap:12px; width:210mm; margin:14px auto -4px; font-size:12px; }
    .site-nav a { color:var(--accent2); font-weight:800; text-decoration:underline; text-underline-offset:3px; }
    .site-nav a:hover { color:var(--accent); }
    .creator-link { color:var(--accent2); font-size:11px; font-weight:800; text-decoration:underline; text-underline-offset:3px; white-space:nowrap; }
    .creator-link:hover { color:var(--accent); }
    @media print { .site-nav { display:none; } }
    @media(max-width:800px){ .site-nav{width:100%;margin:0;padding:12px 18px;background:#fff;border-bottom:1px solid var(--line)} }
  </style>
</head>
<body>

  <div id="app"></div>
  <script>
    const items = [{"english": "Oh, how I miss the quiet.", "translation": "아, 그 고요함이 얼마나 그리운지.", "focus": "감탄문 · miss", "notes": ["Oh, how + 주어 + 동사!는 감정을 강조하는 감탄 표현. miss는 여기서 ‘그리워하다’."], "chunks": ["How I miss those days! → 그 시절이 얼마나 그리운지!"]}, {"english": "[gentle music playing]\nThere is no quiet like the bottom of the sea.", "translation": "[잔잔한 음악] 바다 밑바닥만큼 고요한 곳은 없다.", "focus": "There is no … like …", "notes": ["no quiet는 ‘어떤 고요함도 없다’. like는 ‘~와 같은’이라는 전치사로, 바다의 고요함이 특별함을 강조한다."], "chunks": ["There is no place like home. → 집만 한 곳은 없어."]}, {"english": "And now that my time is running out\nI try to recall it clearly.", "translation": "이제 내게 남은 시간이 얼마 없으니, 그 고요함을 또렷이 떠올려 보려 한다.", "focus": "now that · run out", "notes": ["now that + 문장: 이제 ~이므로. time is running out: 시간이 다 되어 가다. recall은 기억해 내다. it은 앞에서 말한 바다의 고요함을 가리킨다."], "chunks": ["Now that I have time, I can rest. → 이제 시간이 있으니 쉴 수 있어."]}, {"english": "I once knew every current,\nevery path through the kelp.", "translation": "한때 나는 모든 해류와 해초 사이로 난 모든 길을 알고 있었다.", "focus": "once · through", "notes": ["once: 한때, 예전에. current: 해류. kelp: 대형 갈조류(해초). through는 공간을 통과하거나 가로지르는 느낌."], "chunks": ["I once knew this town well. → 예전에는 이 동네를 잘 알았어."]}, {"english": "And the rush of endless freedom.", "translation": "그리고 끝없는 자유가 주던 짜릿함도.", "focus": "문장 조각 · rush", "notes": ["앞 문장의 knew에 이어지는 명사구. rush는 여기서 강렬하게 밀려오는 흥분이나 짜릿함. endless는 끝없는."], "chunks": ["the rush of excitement → 밀려오는 짜릿한 흥분"]}, {"english": "There was a buffet of delicacies,\nall for my taking.", "translation": "온갖 진미가 뷔페처럼 펼쳐져 있었고, 모두 내가 마음껏 가져다 먹을 수 있었다.", "focus": "delicacy · for my taking", "notes": ["delicacies는 별미, 진미. all for my taking은 모두 내가 차지할 수 있었다는 뜻. 흔한 관용 표현 for the taking과 비슷한 의미."], "chunks": ["The opportunity is there for the taking. → 그 기회는 잡기만 하면 돼."]}, {"english": "But best of all,\nI could be alone.", "translation": "하지만 무엇보다 좋았던 건 혼자 있을 수 있다는 것이었다.", "focus": "best of all · could", "notes": ["best of all: 그중에서도 가장 좋게는, 무엇보다. could는 과거에 가능했던 일을 나타낸다. alone은 혼자라는 상태이며 외로움을 반드시 뜻하지는 않는다."], "chunks": ["Best of all, it is free. → 무엇보다 좋은 건 무료라는 거야."]}, {"english": "Oh, how I miss the peace\nand quiet of home.\n[music ends]\n[loud, overlapping voices]", "translation": "아, 고향의 평온함과 고요함이 얼마나 그리운지. [음악이 끝남] [시끄럽게 겹쳐 들리는 목소리들]", "focus": "peace and quiet", "notes": ["peace and quiet: 방해받지 않는 평온함과 고요함. home은 여기서 마셀러스가 살던 바다를 뜻한다."], "chunks": ["I need some peace and quiet. → 좀 조용히 쉬고 싶어."]}, {"english": "[male voice] Especially during\nthe hell of a field trip.", "translation": "[남성 목소리] 특히 현장 학습이라는 지옥 같은 시간에는.", "focus": "especially · field trip", "notes": ["especially: 특히. field trip: 학교 등의 현장 학습. the hell of a field trip은 방문객 때문에 괴로운 상황을 과장한 표현."], "chunks": ["The museum is busy during field trips. → 현장 학습 때는 박물관이 붐벼."]}, {"english": "Day 1,401 of my captivity.", "translation": "갇혀 지낸 지 1,401일째.", "focus": "날짜 기록 · captivity", "notes": ["동사를 생략한 일지식 표현. captivity는 감금된 상태, 사육을 위해 갇힌 상태. 1,401은 one thousand four hundred and one으로 읽을 수 있다."], "chunks": ["Day three of my vacation. → 휴가 3일째."]}, {"english": "A herd of third graders\nand their inept teacher,\nhere to learn about marine life\nand ruin my afternoon.", "translation": "초등학교 3학년 아이들 무리와 그들의 무능한 선생이 해양 생물을 배우고 내 오후를 망치러 왔다.", "focus": "here to · 풍자적인 어휘", "notes": ["herd는 원래 동물의 무리로, 아이들을 못마땅하게 묘사한다. inept: 서투른, 무능한. here to + 동사: ~하러 여기에 온. learn과 ruin이 병렬로 연결된다."], "chunks": ["I am here to learn about art. → 미술에 관해 배우러 왔어요."]}, {"english": "This guy's name is Marcellus,\nand he's a giant Pacific octopus.", "translation": "이 친구의 이름은 마셀러스이고, 대왕태평양문어예요.", "focus": "소유격 · 축약형", "notes": ["guy’s의 ’s는 소유격. he’s는 he is의 축약형. giant Pacific octopus는 문어 종의 이름."], "chunks": ["This guy’s name is Ben. → 이 친구 이름은 벤이에요."]}, {"english": "Kevin, stop licking the glass.", "translation": "케빈, 유리 핥는 것 그만해.", "focus": "stop + -ing", "notes": ["stop + -ing: 하던 행동을 그만두다. stop to + 동사는 다른 행동을 하려고 잠시 멈춘다는 뜻이므로 구별한다. lick: 핥다."], "chunks": ["Stop tapping the desk. → 책상 두드리는 것 그만해."]}, {"english": "I don't see him. He's not in there.", "translation": "안 보여요. 안에 없어요.", "focus": "see · in there", "notes": ["don’t see는 지금 눈에 보이지 않는다는 말. in there는 ‘저 안에’. 관찰 결과를 근거로 없다고 단정하는 대사다."], "chunks": ["I don’t see my keys. → 열쇠가 안 보여."]}, {"english": "[Marcellus] That's because\nI'm camouflaged, Kevin.\nRead the plaque.", "translation": "[마셀러스] 그건 내가 위장하고 있기 때문이야, 케빈. 안내판을 읽어 봐.", "focus": "That’s because · 명령문", "notes": ["That’s because + 문장: 그건 ~이기 때문이야. camouflaged: 주변과 구별되지 않도록 위장한. plaque는 전시물의 안내판. Read는 명령문의 동사 원형."], "chunks": ["That’s because I was busy. → 그건 내가 바빴기 때문이야."]}, {"english": "Uh\n[Marcellus] In this aquarium,\nI am subservient to a species\nbeneath me in every observable metric.", "translation": "어… [마셀러스] 이 수족관에서 나는 관찰 가능한 모든 기준에서 나보다 열등한 종에게 복종하고 있다.", "focus": "subservient to · beneath", "notes": ["be subservient to: ~에게 종속되어 복종하다. beneath me는 자신보다 아래라는 우월감을 드러낸다. metric: 평가 기준, 척도. observable: 관찰 가능한."], "chunks": ["by every measure → 모든 척도로 보아"]}, {"english": "[girl] Hello?\n[Marcellus] To be at their mercy\nis humbling.", "translation": "[여자아이] 안녕? [마셀러스] 그들의 처분에 맡겨져 있다는 건 자존심이 꺾이는 일이다.", "focus": "to부정사 주어 · at someone’s mercy", "notes": ["To be … 전체가 주어이며 is가 서술 동사. at someone’s mercy: 누군가의 뜻에 따라 운명이 좌우되는. humbling은 자신이 대단하지 않음을 깨닫게 하는."], "chunks": ["We are at the mercy of the weather. → 우리는 날씨에 휘둘릴 수밖에 없어."]}, {"english": "Their only redeeming quality is\na tiny mural they leave on my cell.", "translation": "그들에게 그나마 봐줄 만한 점은 내 감방에 남기는 작은 벽화뿐이다.", "focus": "redeeming quality · 관계절", "notes": ["redeeming quality: 단점을 상쇄하는 장점. mural (that) they leave …에서 목적격 관계대명사가 생략되었다. cell은 수조를 감방처럼 표현한 말. mural은 문맥상 유리에 남긴 자국을 비유하는 것으로 읽힌다."], "chunks": ["Its only redeeming quality is the view. → 그나마 장점은 전망뿐이야."]}, {"english": "Each one, unique.\nEach one as intricate as a moon snail.", "translation": "하나하나가 모두 다르다. 하나하나가 달팽이고둥만큼 정교하다.", "focus": "생략 · as … as", "notes": ["Each one 뒤에 is를 보충해 이해할 수 있다. as + 형용사 + as: ~만큼 …한. intricate: 복잡하고 정교한. moon snail은 구슬우렁이류의 바다 고둥을 가리킨다."], "chunks": ["Each design is as intricate as lace. → 각 디자인은 레이스만큼 정교해."]}, {"english": "Of all the humans, I suppose I mind\nthe cleaning lady the least.", "translation": "모든 인간 중에서는 청소하는 여성이 그나마 가장 덜 거슬리는 것 같다.", "focus": "mind · the least", "notes": ["mind는 여기서 신경 쓰이다, 불편하게 여기다. the least는 가장 적게. 좋아한다는 말 대신 ‘가장 덜 거슬린다’고 말하는 절제된 호감. I suppose는 ~인 것 같다."], "chunks": ["I mind the noise the least in the morning. → 아침에는 그 소음이 가장 덜 거슬려."]}, {"english": "Feeling a bit antisocial tonight?\nUh-huh, I know the feeling.", "translation": "오늘 밤은 좀 사람을 피하고 싶은 기분이니? 응, 나도 그 기분 알아.", "focus": "생략된 의문문 · 공감", "notes": ["Are you feeling …?에서 Are you가 생략된 구어체. antisocial은 이 문맥에서 남과 어울리고 싶지 않은. I know the feeling은 상대의 기분에 공감하는 말."], "chunks": ["Feeling tired today? → 오늘 피곤해? / I know the feeling. → 그 기분 알지."]}, {"english": "But you can't hide from me.", "translation": "하지만 내 눈은 피할 수 없지.", "focus": "hide from", "notes": ["hide from + 사람: ~에게 들키지 않도록 숨다. can’t는 불가능함을 나타낸다. 여기서는 친근하게 상대의 존재를 알아챈다는 말."], "chunks": ["You can’t hide from your problems. → 문제를 피해서 숨을 수는 없어."]}, {"english": "I hope you got some fresh scallops today.", "translation": "오늘은 신선한 가리비를 좀 받았으면 좋겠네.", "focus": "hope + 과거절", "notes": ["I hope + 문장: ~이길 바라. got은 이미 오늘 받았을 일을 가리키는 과거형. scallops: 가리비. fresh는 신선한."], "chunks": ["I hope you got some rest. → 좀 쉬었기를 바라."]}, {"english": "I told Terry you must be sick\nof that frozen halibut. Ugh.", "translation": "테리에게 네가 그 냉동 넙치에 분명 질렸을 거라고 말했어. 으.", "focus": "must be · sick of", "notes": ["must be는 여기서 의무가 아니라 강한 추측. be sick of: ~에 질리다. halibut은 큰 넙치류의 생선. Ugh는 불쾌감이나 질림을 나타낸다."], "chunks": ["You must be sick of waiting. → 기다리는 데 정말 질렸겠네."]}, {"english": "[Marcellus] Oh, you have no idea.", "translation": "[마셀러스] 아, 넌 상상도 못 할걸.", "focus": "You have no idea.", "notes": ["직역은 ‘넌 전혀 몰라’. 여기서는 상대의 추측보다 훨씬 심하다고 강조하는 반응. 뒤에 how + 문장을 붙여 구체화할 수 있다."], "chunks": ["You have no idea how tired I am. → 내가 얼마나 피곤한지 넌 상상도 못 해."]}, {"english": "Unlike the rest of her dull species,\nwe share some similarities.", "translation": "그녀와 같은 종의 다른 따분한 개체들과는 달리, 우리에게는 닮은 점이 있다.", "focus": "unlike · share similarities", "notes": ["unlike는 ~와 달리라는 전치사. the rest of: 나머지. dull: 재미없고 따분한. share similarities: 공통점이 있다. 인간을 종 단위로 묘사하는 말투가 이어진다."], "chunks": ["We share some similarities. → 우리에게는 닮은 점이 좀 있어."]}, {"english": "We both prefer the night.\nWe enjoy our solitude.", "translation": "우리는 둘 다 밤을 더 좋아한다. 혼자 있는 시간을 즐긴다.", "focus": "both · solitude", "notes": ["both는 둘 다. prefer: 더 좋아하다. solitude는 홀로 있는 상태나 시간으로, loneliness(외로움)와 달리 즐길 수 있는 상태다."], "chunks": ["We both enjoy quiet evenings. → 우리 둘 다 조용한 저녁을 즐겨."]}, {"english": "Hello, my lovelies.", "translation": "안녕, 내 예쁜 녀석들.", "focus": "다정한 호칭 · lovelies", "notes": ["lovelies는 사랑스럽거나 예쁜 존재들을 다정하게 부르는 복수 명사. my는 여기서 애정을 드러낸다."], "chunks": ["Hello, my lovelies. → 안녕, 사랑스러운 녀석들."]}, {"english": "[Marcellus] Like me,\nshe has a distaste for wolf eels.\n-God sakes!\n-[tool scraping rapidly]", "translation": "[마셀러스] 나처럼 그녀도 늑대장어를 싫어한다. —아이고, 참! —[도구로 빠르게 긁는 소리]", "focus": "have a distaste for · 감탄 표현", "notes": ["have a distaste for: ~을 싫어하다. wolf eel: 늑대장어. God sakes!는 제공된 자막 그대로이며, 짜증을 나타내는 for God’s sake! 계열의 구어적 감탄으로 이해하면 된다."], "chunks": ["I have a distaste for loud parties. → 나는 시끄러운 파티를 싫어해."]}, {"english": "[Marcellus] And sticky floors.\n[gentle music playing]\n[chuckles softly]", "translation": "[마셀러스] 그리고 끈적거리는 바닥도. [잔잔한 음악] [작게 웃음]", "focus": "병렬 생략 · sticky", "notes": ["앞 문장의 has a distaste for에 sticky floors가 이어진다. sticky: 끈적거리는. chuckle: 작게 웃다. 소리 설명은 대사와 구분해 읽는다."], "chunks": ["The floor is sticky. → 바닥이 끈적거려."]}, {"english": "[Marcellus] And we both dream\nof the bottom of the sea.\nOf what we lost there.", "translation": "[마셀러스] 그리고 우리는 둘 다 바다 밑바닥을 꿈꾼다. 그곳에서 잃어버린 것들을.", "focus": "dream of · what절", "notes": ["dream of: ~을 꿈꾸다. Of what …은 앞 문장의 dream에 이어진다. what we lost there는 ‘우리가 그곳에서 잃은 것’이라는 명사절. 상실의 구체적인 내용은 이 발췌만으로 단정하지 않는다."], "chunks": ["I dream of what comes next. → 나는 앞으로 펼쳐질 일을 꿈꿔."]}];

    const escapeHtml = (value) => value
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;");

    const itemsPerPage = 5;
    const totalPages = Math.ceil(items.length / itemsPerPage);
    document.querySelector("#app").innerHTML = Array.from({ length: totalPages }, (_, pageIndex) => {
      const rows = items.slice(pageIndex * itemsPerPage, pageIndex * itemsPerPage + itemsPerPage).map((item, index) => {
        const number = pageIndex * itemsPerPage + index + 1;
        return '<article class="row"><div class="cell english"><span class="num">' + number +
          '</span><span class="sentence">' + escapeHtml(item.english) +
          '</span></div><div class="cell"><span class="focus">' + escapeHtml(item.focus) +
          '</span><ul>' + item.notes.map(note => '<li>' + note + '</li>').join("") +
          '</ul>' + (item.chunks?.length ? '<div class="chunks"><strong>활용 표현</strong>' +
          item.chunks.map(chunk => '<div class="chunk">' + chunk + '</div>').join("") + '</div>' : '') +
          '<p class="translation">' + escapeHtml(item.translation) + '</p></div></article>';
      }).join("");
      const intro = pageIndex === 0
        ? '<section class="note"><strong>Section 1:</strong> 영화 &lt;아쿠아리움이 문을 닫으면&gt;의 제공된 도입부 대사 순서대로 구성했습니다. 시간 정보는 제공되지 않았습니다.</section>'
        : "";
      return '<main class="page"><header><div><h1>Remarkably Bright Creatures</h1><p class="subtitle">Section 1 | 영화 대사 중심 영어 학습 자료</p></div><div class="badge">Page ' +
        (pageIndex + 1) + ' / ' + totalPages + '</div></header>' + intro +
        '<section class="grid" aria-label="Sentence study table">' + rows +
        '</section><footer>Based only on the transcript supplied by the user. English text preserved as provided.</footer></main>';
    }).join("");
  </script>
