<!doctype html>

<head>
  <meta charset="utf-8">

  <title>Remarkably Bright Creatures - Section 2 English Study Sheet</title>
  <style>
    :root { --ink:#202124; --muted:#5f6368; --line:#d7dde5; --soft:#f6f8fa; --accent:#a33a3a; --accent2:#176b87; }
    * { box-sizing:border-box; }
    body { margin:0; background:#e9edf2; color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Arial,sans-serif; line-height:1.42; }
    .page { width:210mm; min-height:297mm; margin:18px auto; padding:13mm 13mm 11mm; background:#fff; box-shadow:0 10px 30px rgba(20,30,50,.16); break-after:page; page-break-after:always; }
    .page:last-child { break-after:auto; page-break-after:auto; }
    header { display:grid; grid-template-columns:1fr auto; gap:14px; align-items:end; padding-bottom:9px; border-bottom:2px solid var(--ink); }
    h1 { margin:0; font-size:19px; letter-spacing:0; }
    .subtitle { margin:4px 0 0; color:var(--muted); font-size:10.5px; }
    .badge { border:1px solid var(--line); border-radius:6px; padding:7px 10px; color:var(--accent); font-size:11px; font-weight:800; white-space:nowrap; }
    .note { margin:10px 0 12px; padding:8px 10px; border-left:4px solid var(--accent2); background:#f3f8fa; color:#263238; font-size:10.5px; }
    .grid { margin-top:10px; border:1px solid var(--line); border-bottom:0; }
    .row { display:grid; grid-template-columns:49% 51%; border-bottom:1px solid var(--line); break-inside:avoid; page-break-inside:avoid; }
    .cell { padding:8px 10px; }
    .english { border-right:1px solid var(--line); }
    .num { display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px; margin-right:6px; border-radius:50%; background:var(--ink); color:#fff; font-size:10px; font-weight:800; vertical-align:top; }
    .sentence { display:inline; white-space:pre-line; font-size:12.2px; font-weight:700; }
    .focus { display:block; margin:0 0 4px; color:var(--accent); font-size:10px; font-weight:850; text-transform:uppercase; }
    ul { margin:0; padding-left:16px; font-size:10.5px; }
    li + li { margin-top:2px; }
    code { padding:1px 4px; border-radius:4px; background:var(--soft); font-family:"SFMono-Regular",Consolas,monospace; font-size:9.7px; }
    .chunks { margin-top:7px; padding:6px 8px; border-left:3px solid #d49a2a; background:#fff9ec; font-size:10.2px; }
    .chunks strong { display:block; margin-bottom:3px; color:#8a5a00; font-size:9.8px; }
    .chunk + .chunk { margin-top:3px; }
    .translation { margin:7px 0 0; padding-top:6px; border-top:1px dashed var(--line); color:var(--muted); font-size:10.4px; }
    .translation::before { content:"해석 "; color:var(--accent2); font-weight:800; }
    footer { margin-top:9px; color:var(--muted); font-size:9.3px; }
    @page { size:A4; margin:0; }
    @media print { body{background:#fff} .page{margin:0;box-shadow:none;width:210mm;min-height:297mm} }
    @media(max-width:800px){ .page{width:100%;min-height:auto;margin:0;padding:18px} .row{grid-template-columns:1fr} .english{border-right:0;border-bottom:1px dashed var(--line)} }
    .site-nav { display:flex; justify-content:space-between; align-items:center; gap:12px; width:210mm; margin:14px auto -4px; font-size:12px; }
    .site-nav a { color:var(--accent2); font-weight:800; text-decoration:underline; text-underline-offset:3px; }
    .site-nav a:hover { color:var(--accent); }
    .creator-link { color:var(--accent2); font-size:11px; font-weight:800; text-decoration:underline; text-underline-offset:3px; white-space:nowrap; }
    .creator-link:hover { color:var(--accent); }
    @media print { .site-nav { display:none; } }
    @media(max-width:800px){ .site-nav{width:100%;margin:0;padding:12px 18px;background:#fff;border-bottom:1px solid var(--line)} }
  </style>

  <script>
    const items = [{"english": "[birds chirping]\n-[man] How're your allergies treating you?\n-Fine.", "translation": "[새들이 지저귐] —알레르기는 좀 어때요? —괜찮아요.", "focus": "How is … treating you?", "notes": ["How is … treating you?는 어떤 일이나 상황이 요즘 어떤지 묻는 안부 표현. How’re는 How are의 축약형이며 여기서는 복수 allergies와 호응한다."], "chunks": ["How is your new job treating you? → 새 직장은 좀 어때?"]}, {"english": "Miranda Downs has been complaining\nabout hers as well.", "translation": "미란다 다운스도 자기 알레르기 때문에 계속 불평하더군요.", "focus": "현재완료진행 · hers", "notes": ["has been complaining은 과거부터 최근까지 이어진 불평. hers는 her allergies를 대신하는 소유대명사. as well은 ‘~도’."], "chunks": ["I’ve been worrying about mine as well. → 나도 내 것 때문에 계속 걱정했어."]}, {"english": "What works for her is a cold washcloth\non her feet before bed.\nHmm? Of all things.", "translation": "그분한테 효과가 있는 건 자기 전에 발에 차가운 물수건을 얹는 거래요. 응? 하필 그런 게 말이에요.", "focus": "what절 · work for", "notes": ["What works for her 전체가 주어로 ‘그녀에게 효과가 있는 것’. of all things는 뜻밖이거나 의외인 것을 강조한다. 이 대사는 인물의 말이며 치료 효과에 대한 안내는 아니다."], "chunks": ["What works for me is a short walk. → 나한테 효과가 있는 건 짧은 산책이야."]}, {"english": "Well, that's her business, isn't it?\nAye.", "translation": "뭐, 그건 그분 사정이잖아요, 안 그래요? 그렇죠.", "focus": "부가의문문 · business", "notes": ["her business는 그녀가 알아서 할 일, 사적인 일. 긍정문 뒤 isn’t it?으로 동의를 구한다. aye는 yes의 뜻으로 쓰이는 말."], "chunks": ["That’s your business, isn’t it? → 그건 네가 알아서 할 일이잖아?"]}, {"english": "Right. Fifteen dollars, please.\nTen. Five. Okay. Here you go.\n-Perfect.\n-Night.", "translation": "자, 15달러입니다. 10달러, 5달러. 자, 여기요. —됐습니다. —잘 자요.", "focus": "계산 · Here you go", "notes": ["Here you go는 물건이나 돈을 건넬 때 ‘여기요’. Night는 Good night를 줄인 작별 인사."], "chunks": ["Here you go. Keep the change. → 여기요. 잔돈은 가지세요."]}, {"english": "Night night, Tova.\nDrive carefully.\nRoads are slick out there.", "translation": "잘 자요, 토바. 운전 조심해요. 밖에 도로가 미끄러워요.", "focus": "명령문 · slick", "notes": ["Night night는 친근한 밤 인사. carefully는 drive를 꾸미는 부사. slick은 도로 등이 젖어서 미끄러운 상태."], "chunks": ["Drive carefully. The roads are slick. → 운전 조심해. 길이 미끄러워."]}, {"english": "They always are. I'm still in one piece.", "translation": "늘 그렇죠. 그래도 난 아직 멀쩡하잖아요.", "focus": "생략 · in one piece", "notes": ["They always are 뒤에는 slick이 생략되어 있다. in one piece는 다치거나 망가지지 않고 무사한 상태."], "chunks": ["I got home in one piece. → 집에 무사히 도착했어."]}, {"english": "-[Tova exhales]\n-[machine beeps]\n[automated voice]\nYou have one new message.", "translation": "[토바가 숨을 내쉼] [기계음] [자동 안내 음성] 새 메시지가 한 통 있습니다.", "focus": "음성 안내 · exhale", "notes": ["exhale은 숨을 내쉬다. automated voice는 자동 안내 음성. one new message는 새 메시지 한 통."], "chunks": ["You have two new messages. → 새 메시지가 두 통 있습니다."]}, {"english": "[man] Mrs. Sullivan.\nBruce from Charter Village Senior Living,\ncalling again.", "translation": "[남성] 설리번 부인, 차터 빌리지 시니어 리빙의 브루스입니다. 다시 전화드립니다.", "focus": "전화에서 자기소개", "notes": ["Bruce … calling again은 This is Bruce … calling again을 생략한 전화 표현. Senior Living은 고령자용 주거 공동체를 가리키는 명칭."], "chunks": ["This is Alex from the office, calling again. → 사무실의 알렉스입니다. 다시 전화드려요."]}, {"english": "We're excited to have you join\nour community here in Bellingham.", "translation": "이곳 벨링햄에 있는 저희 공동체에 함께하시게 되어 기쁩니다.", "focus": "have + 목적어 + 동사원형", "notes": ["have you join은 상대가 참여하는 일을 말한다. excited to는 ~하게 되어 기쁜. 전화 전체 맥락에서는 입주 확정을 기다리며 환영하는 말이다."], "chunks": ["We’re excited to have you join our team. → 우리 팀에 함께하시게 되어 기쁩니다."]}, {"english": "I need to hear from you\nto officially claim your spot.", "translation": "자리를 정식으로 확정하려면 연락을 주셔야 합니다.", "focus": "hear from · claim your spot", "notes": ["hear from someone은 누군가에게 연락을 받다. claim your spot은 마련된 자리나 기회를 본인 것으로 확정하다. to는 목적을 나타낸다."], "chunks": ["Call us to claim your spot. → 자리를 확정하려면 전화해 주세요."]}, {"english": "And then we can talk next steps\nfor your moving in.\nGive me a call back. Thanks.\n[machine beeps]\n[exhales]", "translation": "그다음 입주를 위한 다음 절차를 이야기할 수 있습니다. 전화 부탁드립니다. 감사합니다. [기계음] [숨을 내쉼]", "focus": "next steps · move in", "notes": ["talk next steps는 다음 절차를 논의한다는 업무식 표현. moving in은 입주하기. give me a call back은 다시 전화해 달라는 말."], "chunks": ["We can discuss the next steps tomorrow. → 내일 다음 절차를 논의할 수 있어요."]}, {"english": "[somber music playing]\n[birds calling]\n[rock music plays loudly from van]\n-[metal rattling]\n-[brakes screeching]", "translation": "[침울한 음악] [새 울음소리] [밴에서 크게 흐르는 록 음악] [금속이 덜컹거림] [브레이크가 날카롭게 끼익거림]", "focus": "소리 묘사", "notes": ["somber는 침울하고 엄숙한. rattle은 덜컹거리다. screech는 날카로운 마찰음이나 비명을 내다. 효과음은 인물의 대사와 구별한다."], "chunks": ["The brakes are screeching. → 브레이크가 날카롭게 끼익거려."]}, {"english": "No!\nOh no. Shit. No!\n-[brakes screeching]\n-[metal clanging]\n[rattling, fizzing]", "translation": "안 돼! 아, 안 돼. 젠장. 안 돼! [브레이크 소리] [금속이 쨍그랑 부딪힘] [덜컹거리고 쉬익거리는 소리]", "focus": "감탄사 · 소리 어휘", "notes": ["Shit은 당황하거나 화났을 때 쓰는 거친 욕설. clang은 금속이 부딪치는 큰 소리, fizz는 기포나 가스가 쉬익거리는 소리."], "chunks": ["Oh no! What happened? → 아, 안 돼! 무슨 일이야?"]}, {"english": "You're kidding me! [sighs]\n[engine whizzing]\nOh no, no, no!\n[yelps]", "translation": "말도 안 돼! [한숨] [엔진이 윙윙거림] 아, 안 돼, 안 돼! [짧게 비명을 지름]", "focus": "You’re kidding me!", "notes": ["믿기 힘들거나 황당한 상황에 ‘농담이지? / 말도 안 돼!’라는 반응. yelp는 놀라거나 아파서 짧게 외치는 소리."], "chunks": ["You’re kidding me! It broke again? → 말도 안 돼! 또 고장 났어?"]}, {"english": "[sighs] Now my phone. What the hell?", "translation": "[한숨] 이젠 휴대폰까지. 도대체 뭐야?", "focus": "생략 · What the hell?", "notes": ["Now my phone은 휴대폰에도 문제가 생겼다는 생략 표현. What the hell?은 짜증과 당혹감을 나타내는 거친 말투."], "chunks": ["Now my laptop, too? → 이젠 노트북까지?"]}, {"english": "Can I help you find something?\nYeah, a car\nwith a goddamn working radiator?", "translation": "뭐 찾으시는 걸 도와드릴까요? 네, 라디에이터가 제대로 작동하는 망할 자동차요?", "focus": "with · working", "notes": ["working은 여기서 ‘작동하는’이라는 형용사. radiator는 자동차의 냉각 장치. goddamn은 화를 강조하는 욕설로, 점원의 정중한 질문에 빈정대듯 답한다."], "chunks": ["I need a car with working brakes. → 브레이크가 제대로 작동하는 차가 필요해요."]}, {"english": "Probably the one thing we don't carry.\nYeah. Well, how about a phone charger?", "translation": "아마 저희가 취급하지 않는 유일한 물건일걸요. 네. 그럼 휴대폰 충전기는요?", "focus": "carry · how about", "notes": ["가게에서 carry는 물건을 취급하거나 팔다. the one thing (that) we don’t carry에는 관계대명사가 생략되어 있다. how about으로 대안을 제시한다."], "chunks": ["Do you carry phone chargers? → 휴대폰 충전기 파세요?"]}, {"english": "-Tanner!\n-Yeah?\nBring out a phone charger\nand a cup of coffee\nfor our downwardly mobile friend here.\nThanks.", "translation": "—태너! —네? 여기 형편이 기울어 가는 친구에게 충전기랑 커피 한 잔 가져다줘. 고마워요.", "focus": "bring out · downwardly mobile", "notes": ["bring out은 안에서 밖으로 가져오다. downwardly mobile은 사회·경제적 지위가 내려가는. 여기서는 곤경에 처한 손님을 짓궂게 묘사한다."], "chunks": ["Could you bring out some coffee? → 커피 좀 가져다줄래요?"]}, {"english": "What brings you to Sowell Bay?\nAh, just looking for someone.\n-A friend?\n-No, somebody who owes me money.", "translation": "소웰 베이에는 무슨 일로 왔어요? 아, 사람을 좀 찾고 있어요. —친구요? —아뇨, 저한테 돈을 빚진 사람이요.", "focus": "What brings you to …? · owe", "notes": ["방문 목적을 묻는 자연스러운 표현. somebody who …는 관계절. owe + 사람 + 돈은 그 사람에게 돈을 빚지다."], "chunks": ["What brings you to Seoul? → 서울에는 무슨 일로 오셨어요?"]}, {"english": "That's a fun person\nto be after, huh? [laughs]\nYeah, it'd be a lot more fun\nwith a working van.", "translation": "그런 사람 찾아다니는 건 재미있겠네요, 그렇죠? [웃음] 네, 밴이 제대로 굴러가면 훨씬 재미있겠죠.", "focus": "be after · 가정적인 would", "notes": ["be after someone은 누군가를 찾거나 쫓다. it’d는 it would. with a working van이 ‘밴이 멀쩡하다면’이라는 가정의 뜻을 더한다. 두 사람 모두 반어적으로 말한다."], "chunks": ["It’d be easier with a car. → 차가 있으면 더 쉬울 텐데."]}, {"english": "Tanner, I don't hear you moving!\n-Here you go.\n-Thank you.\n-Yeah.", "translation": "태너, 움직이는 소리가 안 들리는데! —여기요. —고마워요. —네.", "focus": "hear + 목적어 + -ing", "notes": ["hear you moving은 네가 움직이고 있는 소리를 듣다. 일을 빨리 하라는 재촉. 마지막 Yeah는 감사에 대한 가벼운 응답."], "chunks": ["I can hear someone singing. → 누군가 노래하는 소리가 들려."]}, {"english": "-Oh, no shit.\nFriko. I love Friko.\nWe almost opened for them.", "translation": "—와, 진짜네. 프리코. 저 프리코 좋아해요. 저희가 거의 그들 공연의 오프닝을 맡을 뻔했어요.", "focus": "No shit · open for", "notes": ["No shit은 놀람이나 ‘진짜?’를 나타내는 거친 구어체. open for a band는 그 밴드에 앞서 오프닝 공연을 하다. almost는 실제로 성사되지 않았음을 시사한다."], "chunks": ["Our band opened for them last year. → 우리 밴드가 작년에 그들 공연의 오프닝을 맡았어."]}, {"english": "It got really political.\n-They really wanted us, though.\n-Who's \"us\"?", "translation": "이해관계가 아주 복잡해졌거든요. —그래도 그쪽은 저희를 정말 원했어요. —‘저희’가 누군데요?", "focus": "get + 형용사 · though", "notes": ["political은 여기서 정당 정치보다는 공연을 둘러싼 내부 관계나 알력을 말하는 것으로 읽힌다. 문장 끝 though는 ‘그래도’. us가 누구를 가리키는지 되묻는다."], "chunks": ["It got complicated. They liked us, though. → 일이 복잡해졌어. 그래도 우리를 좋아했지."]}, {"english": "My band, Moth Sausage.\nWhat? Wait.\n-You play with Moth Sausage?\n-Yeah.", "translation": "제 밴드요, 모스 소시지. 뭐라고? 잠깐. —모스 소시지에서 연주해요? —네.", "focus": "동사 play · 밴드 소속", "notes": ["play with + 밴드는 그 밴드와 함께 연주하거나 그 밴드에서 활동한다는 뜻. 고유명사는 제공된 영어 표기를 유지한다."], "chunks": ["Do you play with a band? → 밴드에서 연주해요?"]}, {"english": "How did you find us? Wha Bandcamp?\n-Do you know us?\n-Yeah.", "translation": "저희를 어떻게 찾았어요? 뭐, 밴드캠프에서요? —저희 알아요? —네.", "focus": "find · 구어의 끊김", "notes": ["find는 여기서 밴드를 알게 되거나 발견하다. Wha는 대본에 있는 미완의 말로 유지했다. Bandcamp는 음악 플랫폼 이름."], "chunks": ["How did you find our music? → 우리 음악은 어떻게 알게 됐어요?"]}, {"english": "Uh I was just kidding.\nOh.\n-And you were just lying?\n-Yeah.", "translation": "어, 그냥 농담한 건데요. 아. —그럼 당신은 그냥 거짓말한 거예요? —네.", "focus": "과거진행 · kidding vs. lying", "notes": ["was kidding은 앞서 한 말이 농담이었다는 설명. lying은 거짓말하기. 비슷한 형태를 대비해 상대의 허풍을 드러낸다."], "chunks": ["I was just kidding. → 그냥 농담이었어."]}, {"english": "Jeez, I feel terrible now.\nJust for that, breakfast is on the house.\nWe do a fantastic sandwich. Tanner!", "translation": "이런, 괜히 미안하네요. 그 일도 있고 하니 아침은 가게에서 드릴게요. 저희 샌드위치가 끝내줘요. 태너!", "focus": "on the house · do", "notes": ["on the house는 가게에서 무료로 제공하는. Just for that은 방금 일을 이유로 들며 하는 말. 식당에서 do는 특정 음식을 만들어 제공한다는 뜻으로 쓰인다."], "chunks": ["Dessert is on the house. → 디저트는 서비스입니다."]}, {"english": "Oh, you're there. Jeez.\nMake a special for the\nWhat instrument do you play?\nGuitar.", "translation": "아, 거기 있었네. 이런. 스페셜 하나 만들어줘, 저… 무슨 악기 연주해요? 기타요.", "focus": "special · instrument", "notes": ["a special은 식당의 특별 메뉴. for the 뒤에서 말을 멈추고 상대의 악기를 묻는다. instrument는 악기."], "chunks": ["What instrument do you play? → 무슨 악기 연주해요?"]}, {"english": "-The lead guitarist with Mouth Sausage.\n-Okay.", "translation": "—마우스 소시지의 리드 기타리스트에게. —네.", "focus": "lead guitarist · 이름 말장난", "notes": ["lead guitarist는 주선율이나 솔로를 맡는 기타리스트. 앞의 Moth Sausage와 달리 이 대사에는 Mouth Sausage라고 적혀 있어 그대로 유지했다. 오청인지 농담인지는 대본만으로 확정하지 않는다."], "chunks": ["She’s the lead guitarist in our band. → 그녀는 우리 밴드의 리드 기타리스트야."]}, {"english": "And then we'll get you connected\nwith Peter over at the auto repair shop.", "translation": "그다음 자동차 정비소에 있는 피터와 연결해 드릴게요.", "focus": "get + 목적어 + 과거분사", "notes": ["get you connected with는 상대가 연결되도록 해 주다. over at은 다른 장소를 가리키는 친근한 구어 표현. auto repair shop은 자동차 정비소."], "chunks": ["I’ll get you connected with the manager. → 담당 매니저와 연결해 드릴게요."]}, {"english": "-It's bad, isn't it?\n-It's bad.\nLast batch he made tasted like socks.", "translation": "—별로죠, 그렇죠? —별로예요. 지난번에 그 사람이 만든 건 양말 맛이 났어요.", "focus": "부가의문문 · taste like", "notes": ["batch는 한 번에 만든 분량. batch (that) he made에 관계대명사가 생략되었다. taste like는 ~ 같은 맛이 나다. 무엇의 맛인지 발췌 대본만으로 단정하지 않는다."], "chunks": ["This tastes like soap. → 이거 비누 맛이 나."]}, {"english": "[woman 1] And Harriet sees Carol\nin the waiting room.\n-[woman 2] Mm-hmm.\n-They get talking and realize\nthat they have the same symptoms.", "translation": "[여성 1] 그런데 해리엇이 대기실에서 캐럴을 만난 거야. —[여성 2] 응. —얘기를 나누다 보니 둘의 증상이 같다는 걸 알게 된 거지.", "focus": "이야기하는 현재형 · get talking", "notes": ["과거 이야기를 생생하게 전하려고 sees, get, realize 등 현재형을 쓴다. get talking은 이야기를 나누기 시작하다. symptoms는 증상."], "chunks": ["We got talking and found a shared interest. → 이야기를 나누다 공통 관심사를 찾았어."]}, {"english": "That's how they knew\nFred Murphy's sleeping with both of them.\n-[gasps] No!\n-[woman 3] Oh my goodness.", "translation": "그래서 프레드 머피가 둘 다와 잠자리를 갖고 있다는 걸 알게 된 거야. —[놀라 숨을 들이켬] 설마! —[여성 3] 세상에.", "focus": "That’s how · sleep with", "notes": ["That’s how + 문장은 그렇게 해서 ~했다는 뜻. Murphy’s는 Murphy is의 축약. sleep with는 여기서 성관계를 갖다. 인물들이 전하는 소문이다."], "chunks": ["That’s how we met. → 우리는 그렇게 만났어."]}, {"english": "Just like white Ruth\nand black Ruth and Charlie Simpson.\nBarb, you can't say \"white Ruth\"\nand \"black Ruth.\"", "translation": "흰 루스, 검은 루스, 찰리 심프슨 때랑 똑같네. 바브, ‘흰 루스’, ‘검은 루스’라고 하면 안 되지.", "focus": "just like · can’t", "notes": ["just like는 ~와 똑같이. 여기서 can’t는 능력 부족보다 ‘그렇게 말하면 안 된다’는 제지. 다음 대사에서 색이 머리색을 뜻했다고 설명한다."], "chunks": ["You can’t say that. → 그렇게 말하면 안 돼."]}, {"english": "Oh, those are their hair colors.\nOtherwise, it gets confusing.\nDidn't anyone else even bring their yarn?", "translation": "아, 그건 그 사람들 머리색이야. 안 그러면 헷갈리잖아. 다른 사람들은 실도 안 가져온 거야?", "focus": "otherwise · 부정의문문", "notes": ["otherwise는 그렇게 하지 않으면. get confusing은 혼란스러워지다. yarn은 뜨개실. Didn’t anyone …?은 예상과 달라 놀라거나 불만스러운 질문."], "chunks": ["Otherwise, it gets confusing. → 안 그러면 헷갈려."]}, {"english": "Fresh out of the oven?\nYou know Ethan from the Shop-Way?\nWell, he smokes pot.", "translation": "오븐에서 갓 나온 거야? 숍웨이의 이선 알지? 그 사람 대마초 피워.", "focus": "fresh out of · pot", "notes": ["fresh out of the oven은 오븐에서 갓 꺼낸. pot은 여기서 냄비가 아니라 대마초를 뜻하는 속어. You know …?는 상대가 아는 사람을 화제로 꺼내는 말."], "chunks": ["These cookies are fresh out of the oven. → 이 쿠키들은 오븐에서 갓 나왔어."]}, {"english": "I smelled it last time\nI was in there getting cottage cheese.", "translation": "지난번에 코티지치즈를 사러 갔을 때 냄새가 났어.", "focus": "last time · 과거진행", "notes": ["last time (that) …은 지난번 ~했을 때. was in there getting …은 그 안에서 물건을 사고 있던 상황. smell은 smelled라는 과거형으로 쓰였다."], "chunks": ["I saw him last time I was there. → 지난번에 거기 갔을 때 그를 봤어."]}, {"english": "[woman 1] Mary Ann, everyone smokes pot.\nIt's in butter. It's in gummy bears\n[gasps] It's in gummy bears?\nOh", "translation": "[여성 1] 메리 앤, 다들 대마초 피워. 버터에도 들어가고, 곰 모양 젤리에도 들어가. [놀라 숨을 들이켬] 곰 젤리에도 들어간다고? 아…", "focus": "everyone · 반복 의문문", "notes": ["everyone은 단수 취급해 smokes를 쓴다. ‘다들’은 화자의 과장이다. It’s in gummy bears?는 평서문 어순을 그대로 두고 놀라 되묻는 질문. 모든 젤리에 들어간다는 설명으로 읽지 않는다."], "chunks": ["It’s in this, too? → 이것에도 들어 있다고?"]}, {"english": "Tova, you're awful quiet today.\nYou feeling all right?", "translation": "토바, 오늘 유난히 조용하네. 몸은 괜찮아?", "focus": "awful · 생략된 Are", "notes": ["awful은 여기서 구어적으로 awfully처럼 ‘매우’라는 부사 역할을 한다. You feeling …?은 Are you feeling …?에서 Are가 생략된 형태."], "chunks": ["You’re awfully quiet today. → 오늘 무척 조용하네."]}, {"english": "She shouldn't be working nights.\nYou shouldn't be working at all.", "translation": "그 사람 야간 근무하면 안 돼. 아예 일을 하면 안 되지.", "focus": "shouldn’t be -ing · at all", "notes": ["shouldn’t는 하지 않는 게 좋다는 조언이나 판단. work nights는 밤에 일하다. 부정문에서 at all은 ‘전혀’."], "chunks": ["You shouldn’t be working this late. → 이렇게 늦게까지 일하면 안 돼."]}, {"english": "I hate to think of you on your hands\nand knees with all those chemicals.", "translation": "네가 그 온갖 화학약품을 쓰며 바닥에 엎드려 일하는 걸 생각하면 마음이 안 좋아.", "focus": "hate to think · on hands and knees", "notes": ["I hate to think of는 ~을 생각하기도 싫거나 안타깝다는 뜻. on your hands and knees는 두 손과 무릎을 바닥에 댄 자세."], "chunks": ["I hate to think of you waiting alone. → 네가 혼자 기다릴 걸 생각하면 마음이 안 좋아."]}, {"english": "I'm just knitting. I\nGossip doesn't interest me.", "translation": "난 그냥 뜨개질하는 거야. 난… 남 얘기에는 관심 없어.", "focus": "interest · 미완의 말", "notes": ["knit은 뜨개질하다. interest는 ‘관심을 끌다’라는 동사로, Gossip이 주어이고 me가 목적어다. 중간 I는 말을 잇지 못한 부분."], "chunks": ["Gossip doesn’t interest me. → 남 얘기에는 관심 없어."]}, {"english": "And Carol and Harriet\nare dating the same man.\nWell, of course they are.\nThey've both had the same wallpaper\nfor 30 years.", "translation": "그리고 캐럴과 해리엇은 같은 남자를 사귀는 거야. 뭐, 당연하지. 둘 다 30년 동안 같은 벽지를 쓰고 있잖아.", "focus": "현재완료 · both", "notes": ["They’ve both had … for 30 years는 30년 전부터 지금까지 이어진 상태. 같은 벽지를 쓸 만큼 취향이 비슷하니 남자 취향도 같다는 농담으로 읽힌다."], "chunks": ["They’ve both lived here for years. → 둘 다 여기서 여러 해 살아왔어."]}, {"english": "The wallpaper, I can understand. Fred?\nSowell Bay is a fish tank.\nThat's what Will used to say.", "translation": "벽지는 이해하겠어. 그런데 프레드라고? 소웰 베이는 어항이야. 윌이 늘 그렇게 말했지.", "focus": "화제 전면 배치 · used to", "notes": ["The wallpaper를 앞으로 빼서 강조한다. Fred?는 그 남자를 택한 건 이해하기 어렵다는 반응. fish tank는 서로가 훤히 보이는 작은 마을의 비유. used to는 과거의 습관."], "chunks": ["That’s what my dad used to say. → 우리 아빠가 늘 그렇게 말하곤 했어."]}, {"english": "He used to say he couldn't buy\na jar of peanut butter\nwithout the whole town\nknowing an hour later. [chuckles]", "translation": "땅콩버터 한 병만 사도 한 시간 뒤면 온 동네가 다 알게 된다고 하곤 했지. [작게 웃음]", "focus": "can’t … without -ing", "notes": ["~하지 않고서는 …할 수 없다는 구조로, 결국 무슨 일을 하든 알려진다는 뜻. without 뒤 the whole town은 knowing의 의미상 주어. a jar of는 병에 담긴 양을 센다."], "chunks": ["I can’t leave without someone noticing. → 누군가 눈치채지 않고는 나갈 수 없어."]}, {"english": "Ah\nWill\nHe's the one who got us on the list\nof that daycare for seniors,\nCharter Village.", "translation": "아… 윌. 그 노인 돌봄 시설, 차터 빌리지 대기 명단에 우리를 올린 사람이 그이야.", "focus": "the one who · get on the list", "notes": ["the one who는 ~한 바로 그 사람. got us on the list는 우리를 명단에 올렸다. daycare for seniors는 화자의 표현이며, 앞선 입주 전화와 함께 보면 시설을 낮춰 부르는 뉘앙스로도 읽힌다."], "chunks": ["She’s the one who got me on the list. → 나를 명단에 올려 준 사람이 바로 그 사람이야."]}, {"english": "They keep calling me,\nwanting to know my plans.", "translation": "거기서 계속 전화해서 내 계획이 뭔지 알고 싶어 해.", "focus": "keep -ing · 분사구문", "notes": ["keep calling은 반복해서 전화하다. wanting …은 전화하는 쪽의 의도나 부수 상황을 덧붙인다. plans는 앞으로 어떻게 할 것인지에 대한 계획."], "chunks": ["They keep asking about my plans. → 그들은 내 계획을 계속 물어봐."]}, {"english": "Right before he got sick,\nhe put us on the list.", "translation": "그이가 아프기 직전에 우리를 명단에 올렸어.", "focus": "right before · get sick", "notes": ["right before는 바로 직전에. get sick는 아프게 되다. put의 현재형과 과거형은 모양이 같으며 여기서는 과거다."], "chunks": ["Call me right before you leave. → 출발하기 바로 전에 전화해."]}, {"english": "I think he was just worried about me\nending up in that house alone.", "translation": "내가 결국 그 집에 혼자 남게 될까 봐 걱정했던 것 같아.", "focus": "worried about · end up", "notes": ["about 뒤 me ending up … 전체가 걱정의 대상. end up은 결국 어떤 상태나 상황에 이르다. alone은 혼자서."], "chunks": ["I’m worried about ending up alone. → 결국 혼자 남게 될까 봐 걱정돼."]}, {"english": "Will wanted to sell the place.\nThirty years ago, right after Erik\nAfter he was gone.", "translation": "윌은 그 집을 팔고 싶어 했어. 30년 전, 에릭이… 그 애가 떠나고 바로 뒤에.", "focus": "want to · 완곡한 gone", "notes": ["the place는 그 집. 말을 멈췄다가 After he was gone으로 바꾸며 상실을 에둘러 말한다. 구체적인 사정은 이 대본만으로 단정하지 않는다."], "chunks": ["He wanted to sell the house. → 그는 그 집을 팔고 싶어 했어."]}, {"english": "\"Move on,\" he said.\n\"Move on. Sell the house.\"\nI couldn't.", "translation": "‘이제 앞으로 나아가자’고 했지. ‘털어내고 집을 팔자.’ 난 그럴 수 없었어.", "focus": "move on · couldn’t의 생략", "notes": ["move on은 과거의 일이나 상실에 머물지 않고 삶을 이어 가다. I couldn’t 뒤에는 앞서 말한 일을 한다는 내용이 생략되어 있다."], "chunks": ["I’m trying to move on. → 다시 삶을 이어 가려고 노력 중이야."]}, {"english": "Maybe he was right.\n[sighs] Maybe Maybe I've got to move on.", "translation": "어쩌면 그이가 옳았는지도 몰라. [한숨] 어쩌면… 어쩌면 나도 이제 앞으로 나아가야 하나 봐.", "focus": "maybe · have got to", "notes": ["Maybe는 아마, 어쩌면. have got to + 동사는 ~해야 한다는 뜻으로 have to와 비슷하다. 반복되는 Maybe가 망설임을 드러낸다."], "chunks": ["Maybe I’ve got to make a change. → 어쩌면 나도 변화를 줘야 하나 봐."]}, {"english": "[Marcellus] Though she lives\nin a larger tank than me,\nI can deduce that the cleaning lady\nalso wishes to break free.", "translation": "[마셀러스] 그녀는 나보다 더 큰 수조에서 살지만, 청소하는 여성 역시 벗어나고 싶어 한다는 것을 추론할 수 있다.", "focus": "though · deduce · break free", "notes": ["Though는 ~이지만. larger tank는 그녀가 사는 환경을 수조에 빗댄 표현. deduce는 단서로 추론하다. break free는 구속에서 벗어나다. than me는 회화에서 흔한 비교 표현."], "chunks": ["She wants to break free from routine. → 그녀는 반복되는 일상에서 벗어나고 싶어 해."]}, {"english": "My superior intelligence\nmakes me uniquely attuned\nto the behavior of all creatures.", "translation": "나의 우월한 지능 덕분에 나는 모든 생물의 행동을 남달리 민감하게 알아챈다.", "focus": "make + 목적어 + 형용사", "notes": ["makes me attuned에서 attuned가 me의 상태를 설명한다. be attuned to는 ~을 민감하게 알아차리다. uniquely는 남다르게. 자신의 지능을 높게 평가하는 말투다."], "chunks": ["She is attuned to other people’s feelings. → 그녀는 다른 사람의 감정을 민감하게 알아차려."]}, {"english": "And I suspect that what she needs\nto escape\n[Tova groans]\nlurks somewhere deeper.", "translation": "그리고 그녀가 벗어나야 하는 것은 [토바가 신음함] 어딘가 더 깊은 곳에 숨어 있다고 나는 짐작한다.", "focus": "명사절 what · lurk", "notes": ["suspect는 여기서 ~라고 짐작하다. what she needs to escape 전체가 lurks의 주어이며 ‘그녀가 벗어나야 할 것’. escape는 여기서 타동사. lurk는 숨어 있다, 도사리다."], "chunks": ["I suspect the problem lies deeper. → 문제는 더 깊은 곳에 있는 것 같아."]}];

    const escapeHtml = (value) => value
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;");

    const itemsPerPage = 5;
    const totalPages = Math.ceil(items.length / itemsPerPage);
    document.querySelector("#app").innerHTML = Array.from({ length: totalPages }, (_, pageIndex) => {
      const rows = items.slice(pageIndex * itemsPerPage, pageIndex * itemsPerPage + itemsPerPage).map((item, index) => {
        const number = pageIndex * itemsPerPage + index + 1;
        return '<article class="row"><div class="cell english"><span class="num">' + number +
          '</span><span class="sentence">' + escapeHtml(item.english) +
          '</span></div><div class="cell"><span class="focus">' + escapeHtml(item.focus) +
          '</span><ul>' + item.notes.map(note => '<li>' + note + '</li>').join("") +
          '</ul>' + (item.chunks?.length ? '<div class="chunks"><strong>활용 표현</strong>' +
          item.chunks.map(chunk => '<div class="chunk">' + chunk + '</div>').join("") + '</div>' : '') +
          '<p class="translation">' + escapeHtml(item.translation) + '</p></div></article>';
      }).join("");
      const intro = pageIndex === 0
        ? '<section class="note"><strong>Section 2:</strong> 영화 &lt;아쿠아리움이 문을 닫으면&gt;의 제공된 두 번째 구간 대사 순서대로 구성했습니다. 시간 정보는 제공되지 않았습니다.</section>'
        : "";
      return '<main class="page"><header><div><h1>Remarkably Bright Creatures</h1><p class="subtitle">Section 2 | 영화 대사 중심 영어 학습 자료</p></div><div class="badge">Page ' +
        (pageIndex + 1) + ' / ' + totalPages + '</div></header>' + intro +
        '<section class="grid" aria-label="Sentence study table">' + rows +
        '</section><footer>Based only on the transcript supplied by the user. English text preserved as provided.</footer></main>';
    }).join("");
